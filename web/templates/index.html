                const expected = { start_time: task.start_time_iso, end_time: task.end_time_iso };
                let changes = null;

                const guideLine = document.createElement('div');
                guideLine.className = 'drag-guide-line';
                guideLine.innerHTML = '<span class="drag-guide-label"></span>';
                timeline.appendChild(guideLine);
                taskEl.classList.add('dragging');
                taskEl.style.transition = 'none';

                function restorePosition() {
                    originalParent.appendChild(taskEl);
                    taskEl.style.top = originalTop;
                    taskEl.style.height = originalHeight;
                    taskEl.dataset.dispStart = originalStart;
                    taskEl.dataset.dispEnd = originalEnd;
                    relayoutTimelineColumns();
                }

                function onMove(event) {
                    if (!taskEl.isConnected || currentDate !== dragDate) return;
                    const minutes = (event.clientY - startY) / hourHeight * 60;
                    const snapped = Math.round(minutes / 5) * 5;
                    const delta = Math.max(Math.ceil(-originalStart),
                        Math.min(Math.max(0, Math.floor(1439 - originalStart)), snapped));
                    const start = shiftTaskTime(expected.start_time, delta);
                    const end = shiftTaskTime(expected.end_time, delta);
                    const range = timelineRange({ start_time_iso: start, end_time_iso: end }, dragDate);
                    if (!range) return;

                    changes = delta ? { start_time: start, end_time: end } : null;
                    const hour = Math.floor(range.start / 60);
                    const minute = range.start % 60;
                    const target = timeline.querySelector(`[data-hour="${hour}"] .hour-content`);
                    if (!target) return;

                    target.appendChild(taskEl);
                    taskEl.style.top = `${minute / 60 * hourHeight + 4}px`;
                    taskEl.style.height = `${Math.max((range.end - range.start) / 60 * hourHeight - 8, 40)}px`;
                    taskEl.dataset.dispStart = range.start;
                    taskEl.dataset.dispEnd = range.end;
                    scheduleRelayout();

                    guideLine.style.top = `${taskEl.getBoundingClientRect().top - timeline.getBoundingClientRect().top}px`;
                    guideLine.classList.add('visible');
                    guideLine.querySelector('.drag-guide-label').textContent =
                        `${String(hour).padStart(2, '0')}:${String(Math.floor(minute)).padStart(2, '0')}`;
                }

                async function onUp() {
                    document.removeEventListener('mousemove', onMove);
                    document.removeEventListener('mouseup', onUp);
                    guideLine.remove();

                    if (!changes || !taskEl.isConnected || currentDate !== dragDate) {
                        taskEl.classList.remove('dragging');
                        taskEl.style.transition = '';
                        return;
                    }

                    saving = true;
                    try {
                        const response = await fetch(`/task/${task.id}/time`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ ...changes, expected }),
                        });
                        const data = await response.json();
                        if (!response.ok || !data.success) throw new Error(data.error || '无法保存时间');
                        syncMovedTask(data.task);
                    } catch (error) {
                        if (taskEl.isConnected) restorePosition();
                        alert('调整时间失败: ' + error.message);
                    } finally {
                        saving = false;
                        // Suppress the click generated by releasing a dragged task.
                        setTimeout(() => {
                            taskEl.classList.remove('dragging');
                            taskEl.style.transition = '';
                        }, 0);
                    }
                }

                document.addEventListener('mousemove', onMove);
                document.addEventListener('mouseup', onUp);
            });
        }

        // 点击任务 - 打开编辑弹窗
        function selectTask(taskId) {
            openEditModal(taskId);
        }

        // 切换状态
        async function toggleStatus(event, taskId, currentStatus) {
            event.stopPropagation();
            const action = currentStatus === 'doing' ? 'done' : 'start';
            try {
                const response = await fetch(`/task/${taskId}/${action}`, { method: 'POST' });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error);
                location.reload();
            } catch (error) {
                alert('任务状态更新失败: ' + error.message);
            }
        }

        // 模态框操作
        function openAddModal() {
            resetForm();
            document.getElementById('addModal').classList.add('active');
            document.getElementById('taskName').focus();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.remove('active');
        }

        function resetForm() {
            document.getElementById('taskName').value = '';
            document.getElementById('taskReminder').checked = false;
            document.getElementById('customTag').value = '';

            markSegment('prioritySegment', 'medium');

            // 重置标签选择（重建为全未选中的动态标签列表）
            rebuildAddTagOptions();

            resetAddTimeDefaults();
        }

        function addTask() {
            const name = document.getElementById('taskName').value.trim();
            if (!name) {
                alert('请输入任务名称');
                return;
            }

            // 从控件读取时间（hour 24 已在 fmtDateTime 内规范化为次日零点）
            const start = readAddTime('start');
            const end = readAddTime('end');
            const startTime = start ? fmtDateTime(start.date, start.hour, start.minute) : null;
            const endTime = end ? fmtDateTime(end.date, end.hour, end.minute) : null;

            const data = {
                name: name,
                priority: segmentValue('prioritySegment'),
                tags: getSelectedTags(),
                start_time: startTime,
                end_time: endTime,
                reminder: document.getElementById('taskReminder').checked
            };

            fetch('/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    location.reload();
                } else {
                    alert('添加失败: ' + data.error);
                }
            });
        }

        // 点击模态框外部关闭
        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });

        // ESC 关闭模态框
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeAddModal();
                closeEditModal();
            }
        });

        // ========== 编辑任务相关函数 ==========

        let editingTask = null;

        // 初始化编辑弹窗的时间选择器
        function initEditTimePickers() {
            buildTimeSelects('editStartHour', 'editStartMinute');
            buildTimeSelects('editEndHour', 'editEndMinute');
        }

        // 创建标签选项 DOM
        function createTagOption(tagValue, isSelected) {
            const label = document.createElement('label');
            label.className = 'tag-option' + (isSelected ? ' selected' : '');
            label.innerHTML = `<input type="checkbox" value="${tagValue}"${isSelected ? ' checked' : ''}>${tagValue}`;
            label.addEventListener('click', function(e) {
                e.preventDefault();
                this.classList.toggle('selected');
                this.querySelector('input').checked = !this.querySelector('input').checked;
            });
            return label;
        }

        // 打开编辑弹窗
        function openEditModal(taskId) {
            const task = allTasks.find(t => t.id === taskId);
            if (!task) return;
            editingTask = task;

            document.getElementById('editTaskName').value = task.name;
            markSegment('editPrioritySegment', task.priority);
            document.getElementById('editTaskReminder').checked = task.reminder;

            // 构建标签（动态标签库 + 该任务自身的标签）
            const container = document.getElementById('editTagsContainer');
            container.innerHTML = '';
            const tagPool = [...new Set([...knownTags, ...task.tags])];
            tagPool.forEach(tag => {
                container.appendChild(createTagOption(tag, task.tags.includes(tag)));
            });

            // 自定义标签输入
            document.getElementById('editCustomTag').value = '';

            writeEditTime('editStart', task.start_time_iso);
            writeEditTime('editEnd', task.end_time_iso);

            document.getElementById('editModal').classList.add('active');
            document.getElementById('editTaskName').focus();
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
            editingTask = null;
        }

        function clearEditTime(which) {
            writeEditTime(which === 'start' ? 'editStart' : 'editEnd', null);
        }

        function writeEditTime(prefix, iso) {
            const time = iso ? splitTaskTime(iso) : { date: '', hour: 0, minute: 0 };
            document.getElementById(prefix + 'Date').value = time.date;
            document.getElementById(prefix + 'Hour').value = time.hour;
            document.getElementById(prefix + 'Minute').value = time.minute;
        }

        function readEditTime(prefix, original) {
            const date = document.getElementById(prefix + 'Date').value;
            if (!date) return null;
            const value = fmtDateTime(date, document.getElementById(prefix + 'Hour').value,
                document.getElementById(prefix + 'Minute').value);
            return original?.slice(0, 16) === value.slice(0, 16) ? original : value;
        }

        async function saveEditTask() {
            const task = editingTask;
            if (!task) return;
            const name = document.getElementById('editTaskName').value;
            if (!name.trim()) { alert('请输入任务名称'); return; }

            const original = {
                name: task.name, priority: task.priority, reminder: task.reminder,
                start_time: task.start_time_iso, end_time: task.end_time_iso, tags: task.tags,
            };
            const selectedTags = new Set(Array.from(
                document.querySelectorAll('#editTagsContainer .tag-option.selected input'), input => input.value));
            const oldTags = new Set(task.tags);
            const tags = [...task.tags.filter(tag => selectedTags.has(tag)),
                ...[...selectedTags].filter(tag => !oldTags.has(tag))];
            const values = {
                name: name === original.name ? name : name.trim(),
                priority: segmentValue('editPrioritySegment'),
                reminder: document.getElementById('editTaskReminder').checked,
                start_time: readEditTime('editStart', original.start_time),
                end_time: readEditTime('editEnd', original.end_time),
                tags: tags.length === original.tags.length && tags.every((tag, i) => tag === original.tags[i])
                    ? original.tags : tags,
            };
            const changes = {};
            const expected = {};
            for (const [field, value] of Object.entries(values)) {
                if (value !== original[field]) {
                    changes[field] = value;
                    expected[field] = original[field];
                }
            }
            if (!Object.keys(changes).length) {
                closeEditModal();
                return;
            }

            try {
                const response = await fetch(`/task/${task.id}/edit`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...changes, expected }),
                });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.error || '无法保存任务');
                location.reload();
            } catch (error) {
                alert('保存失败: ' + error.message);
            }
        }

        function deleteEditTask(button) {
            if (editingTask) deleteTask(editingTask, button);
        }

        async function deleteTask(task, button) {
            if (!confirm(`删除「${task.name}」？已有执行与进展记录会保留。`)) return;
            button.disabled = true;
            try {
                const response = await fetch(`/task/${encodeURIComponent(task.id)}`, { method: 'DELETE' });
                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.error || '无法删除任务');
                location.reload();
            } catch (error) {
                alert('删除失败：' + error.message);
            } finally {
                button.disabled = false;
            }
        }
    </script>
</body>
</html>
